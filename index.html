<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Level Up">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050912'/%3E%3Cpath d='M32 10l16 10v20L32 54 16 44V20z' fill='none' stroke='%2325e4ff' stroke-width='3'/%3E%3Cpath d='M32 22v20M24 30l8-8 8 8' fill='none' stroke='%233ba7ff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Level Up System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first HUD shell. Bottom tab bar on phones, left rail from 900px. One dark world by choice: abyss blue, electric cyan. */
:root{
  --bg:#050912;--bg2:#0a1226;--panel:rgba(13,24,48,.8);--panel2:rgba(22,40,78,.72);--solid:#0c1630;
  --line:rgba(80,160,255,.26);--line2:rgba(80,160,255,.55);
  --fg:#e8f0ff;--dim:#9db0d2;--faint:#6b81a8;
  --accent:#3ba7ff;--accent2:#25e4ff;--glow:rgba(59,167,255,.4);--onaccent:#04101f;
  --good:#37dfa0;--warn:#ffc552;--bad:#ff6f7f;--viol:#9b86ff;
  --f-disp:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-skin="violeta"]{--accent:#9b86ff;--accent2:#d58bff;--line:rgba(160,130,255,.28);--line2:rgba(160,130,255,.58);--glow:rgba(155,134,255,.4)}
:root[data-skin="brasa"]{--accent:#ff8a3d;--accent2:#ffc552;--line:rgba(255,150,80,.28);--line2:rgba(255,150,80,.58);--glow:rgba(255,138,61,.4)}
:root[data-skin="esmeralda"]{--accent:#2fd9a0;--accent2:#8dffe2;--line:rgba(60,220,170,.28);--line2:rgba(60,220,170,.58);--glow:rgba(47,217,160,.4)}
:root[data-skin="gelo"]{--accent:#9fd8ff;--accent2:#eaf7ff;--line:rgba(170,220,255,.3);--line2:rgba(170,220,255,.6);--glow:rgba(159,216,255,.4)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--bg);
  background-image:radial-gradient(900px 480px at 85% -10%,rgba(59,167,255,.14),transparent 60%),radial-gradient(700px 420px at -10% 40%,rgba(37,228,255,.07),transparent 60%),linear-gradient(rgba(80,160,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(80,160,255,.035) 1px,transparent 1px);
  background-size:auto,auto,36px 36px,36px 36px;background-attachment:fixed;
  color:var(--fg);font:15px/1.5 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;font-weight:600;letter-spacing:.02em;text-wrap:balance}
h2{font-size:19px}h3{font-size:16px}h4{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-weight:500}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 20px}
.tabular,.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp)}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.grow{flex:1;min-width:0}.right{margin-left:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sp{height:4px}
/* HUD panel */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:14px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 0 40px rgba(59,167,255,.04)}
.panel::before{content:"";position:absolute;left:0;top:0;width:18px;height:18px;border-left:2px solid var(--accent);border-top:2px solid var(--accent);opacity:.9;pointer-events:none}
.panel.flat{clip-path:none;padding:12px}.panel.flat::before{display:none}
.panel.hot{border-color:var(--line2);box-shadow:inset 0 0 0 1px rgba(37,228,255,.12),inset 0 0 50px rgba(59,167,255,.1)}
.pt{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pt h3,.pt h4{flex:1}
.lab{font-family:var(--f-disp);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
/* header + nav */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent);margin:0 auto;max-width:720px}
.logo{font-family:var(--f-disp);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--accent2);text-shadow:0 0 14px var(--glow)}
.logo small{display:block;font-weight:500;letter-spacing:.16em;color:var(--faint);font-size:10px}
.sync{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;gap:2px;background:rgba(6,11,24,.94);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.nav button{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--faint);font-family:var(--f-disp);font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;border-radius:4px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current=page]{color:var(--accent2);background:rgba(59,167,255,.12);box-shadow:inset 0 2px 0 var(--accent)}
@media(min-width:900px){
  body{padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 92px);padding-block:0 30px}
  .nav{top:0;right:auto;width:88px;flex-direction:column;justify-content:center;gap:6px;border-top:0;border-right:1px solid var(--line);padding:12px 6px;padding-left:max(6px,env(safe-area-inset-left,0px))}
  .nav button[aria-current=page]{box-shadow:inset 3px 0 0 var(--accent)}
}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:1px solid var(--line2);background:rgba(59,167,255,.1);color:var(--fg);font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));text-align:center}
.btn:hover{background:rgba(59,167,255,.2)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.bad{border-color:rgba(255,111,127,.6);color:var(--bad);background:rgba(255,111,127,.08)}
.btn.sm{min-height:38px;padding:0 12px;font-size:12px}
.btn.xl{min-height:64px;font-size:17px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:rgba(59,167,255,.08);border:1px solid var(--line);color:var(--fg);cursor:pointer;border-radius:3px}
.ib svg{width:20px;height:20px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;background:rgba(5,10,22,.85);border:1px solid var(--line);color:var(--fg);padding:0 12px;border-radius:3px;font-size:16px}
textarea{padding:10px 12px;min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);outline:none;box-shadow:0 0 0 2px rgba(37,228,255,.18)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim)}
label.chk{display:flex;gap:10px;align-items:center;min-height:36px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(10,18,38,.7);color:var(--dim);font-size:13.5px;cursor:pointer;border-radius:20px}
.chip[aria-pressed=true],.chip.on{border-color:var(--accent2);color:var(--fg);background:rgba(37,228,255,.14);box-shadow:0 0 12px rgba(37,228,255,.12)}
.sub{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;min-height:40px;padding:0 14px;background:none;border:0;border-bottom:2px solid var(--line);color:var(--faint);font-family:var(--f-disp);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sub button[aria-current=true]{color:var(--accent2);border-color:var(--accent2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border:1px solid var(--line);border-radius:12px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--good);border-color:rgba(55,223,160,.45)}.pill.warn{color:var(--warn);border-color:rgba(255,197,82,.45)}.pill.acc{color:var(--accent2);border-color:var(--line2)}
.tag-m{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border:1px dashed var(--line);padding:1px 6px;border-radius:3px}
/* progress */
.bar{height:10px;background:rgba(80,160,255,.14);border:1px solid var(--line);position:relative;overflow:hidden;border-radius:2px}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--glow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:6px}
.bar.neutral>i{background:linear-gradient(90deg,#4d6fa8,#7fa6df);box-shadow:none}
.calm .bar>i{transition:none}
.ring{position:relative;width:var(--s,84px);height:var(--s,84px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--f-disp);font-size:calc(var(--s,84px)*.2);line-height:1.1}
.ring b small{font-size:.55em;color:var(--dim);font-weight:500}
/* rank / avatar */
.rankb{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;font-family:var(--f-disp);font-weight:700;font-size:17px;color:var(--accent2);border:1.5px solid var(--accent2);background:rgba(37,228,255,.08);transform:skewX(-8deg);box-shadow:0 0 14px var(--glow)}
.rankb span{display:inline-block;transform:skewX(8deg)}
.rankb.lg{min-width:64px;height:64px;font-size:30px}
.av{flex:none;display:block}
.stat-n{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1.1}
.stat-l{font-size:11.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.attr{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center}
.attr b{font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
/* quests */
.quest{display:flex;flex-direction:column;gap:8px}
.quest.done{opacity:.72}
.quest.done .qt::after{content:"CONCLUÍDA";margin-left:8px;font-size:10.5px;letter-spacing:.14em;color:var(--good);border:1px solid rgba(55,223,160,.5);padding:1px 6px}
.qt{font-family:var(--f-disp);font-weight:600;font-size:15.5px}
.xp{font-family:var(--f-disp);font-weight:700;color:var(--accent2);font-size:13px;white-space:nowrap}
/* lists */
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(80,160,255,.12)}
.item:last-child{border-bottom:0}
.item .t{font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--f-disp);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid rgba(80,160,255,.1);vertical-align:top}
.scrollx{overflow-x:auto}
.empty{text-align:center;padding:22px 10px;color:var(--dim);border:1px dashed var(--line)}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:6px}
.note{font-size:12.5px;color:var(--dim);border-left:2px solid var(--line2);padding:2px 0 2px 10px}
.warnbox{border:1px solid rgba(255,197,82,.5);background:rgba(255,197,82,.07);padding:10px 12px;font-size:13.5px}
.errbox{border:1px solid rgba(255,111,127,.5);background:rgba(255,111,127,.07);padding:10px 12px;font-size:13.5px;color:#ffc9cf}
details>summary{cursor:pointer;color:var(--accent2);font-size:13px;min-height:32px;display:flex;align-items:center}
details .in{padding:6px 0 2px;font-size:13.5px;color:var(--dim)}
/* week dots */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wk div{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--faint)}
.wk i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--dim)}
.wk .pl i{border-style:dashed;border-color:var(--line2)}
.wk .dn i{background:var(--accent);border-color:var(--accent2);color:var(--onaccent);box-shadow:0 0 10px var(--glow)}
.wk .td i{outline:2px solid var(--accent2);outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10.5px;color:var(--faint);text-align:center;font-family:var(--f-disp);letter-spacing:.08em}
.cal button{aspect-ratio:1;min-height:38px;background:rgba(10,18,38,.6);border:1px solid rgba(80,160,255,.12);color:var(--dim);font-size:12.5px;position:relative;cursor:pointer;border-radius:3px;padding:0}
.cal button.pl{border-color:var(--line2);border-style:dashed}
.cal button.dn{background:rgba(59,167,255,.3);border-color:var(--accent2);color:var(--fg)}
.cal button.td{outline:2px solid var(--accent2);outline-offset:1px}
.cal button.off{visibility:hidden}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:10px;fill:var(--faint)}
.chart .gl{stroke:rgba(80,160,255,.14);stroke-width:1}
.chart .ax{stroke:rgba(80,160,255,.3);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
/* modal */
.mback{position:fixed;inset:0;z-index:70;background:rgba(2,5,12,.8);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--solid);border:1px solid var(--line2);border-bottom:0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 50px rgba(0,0,0,.6)}
@media(min-width:700px){.mback{align-items:center}.modal{border-bottom:1px solid var(--line2);max-height:86vh;padding-bottom:20px}}
.mh{display:flex;align-items:center;gap:10px}.mh h2{flex:1}
/* live workout */
.live{position:fixed;inset:0;z-index:50;background-color:var(--bg);background-image:radial-gradient(700px 400px at 50% -10%,rgba(59,167,255,.16),transparent 60%);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.live .in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.lhd{display:flex;align-items:center;gap:10px}
.exn{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.15}
.step{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:stretch}
.step button{min-height:64px;font-size:26px;background:rgba(59,167,255,.12);border:1px solid var(--line2);color:var(--fg);cursor:pointer;font-family:var(--f-disp)}
.step input{min-height:64px;text-align:center;font-family:var(--f-disp);font-size:30px;font-weight:700}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{min-height:50px;border:1px solid var(--line);background:rgba(10,18,38,.7);color:var(--dim);font-family:var(--f-disp);font-size:17px;cursor:pointer}
.rpe button[aria-pressed=true]{background:rgba(37,228,255,.18);border-color:var(--accent2);color:var(--fg)}
.setchips{display:flex;gap:6px;flex-wrap:wrap}
.setchips button{min-width:46px;min-height:44px;padding:0 8px;background:rgba(10,18,38,.7);border:1px solid var(--line);color:var(--dim);font-family:var(--f-disp);font-size:13px;cursor:pointer}
.setchips button.dn{border-color:var(--good);color:var(--good)}
.setchips button.cur{outline:2px solid var(--accent2);color:var(--fg)}
.rest{display:flex;align-items:center;gap:14px}
.rest .big{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1;color:var(--accent2);text-shadow:0 0 18px var(--glow)}
.exrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(80,160,255,.12);font-size:13.5px}
.exrow.cur{color:var(--accent2)}
/* system toasts + celebrate */
#toasts{position:fixed;z-index:90;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.sys{pointer-events:auto;background:rgba(8,16,34,.96);border:1px solid var(--accent2);box-shadow:0 0 22px var(--glow),inset 0 0 24px rgba(37,228,255,.08);padding:10px 14px;display:flex;gap:12px;align-items:flex-start;animation:sysin .35s ease-out both}
.sys .st{font-family:var(--f-disp);font-size:11px;letter-spacing:.2em;color:var(--accent2)}
.sys b{font-family:var(--f-disp);display:block;font-size:15px}
.sys svg{width:26px;height:26px;color:var(--accent2);flex:none}
.sys.bad{border-color:var(--bad)}.sys.bad .st,.sys.bad svg{color:var(--bad)}
.sys.warn{border-color:var(--warn)}.sys.warn .st,.sys.warn svg{color:var(--warn)}
@keyframes sysin{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.celeb{position:fixed;inset:0;z-index:100;background:radial-gradient(600px 500px at 50% 40%,rgba(37,228,255,.2),transparent 70%),rgba(3,6,14,.97);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.celeb .box{max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:center;animation:rise .6s ease-out both}
.celeb .big{font-family:var(--f-disp);font-size:46px;font-weight:700;letter-spacing:.08em;color:var(--accent2);text-shadow:0 0 30px var(--glow);line-height:1}
.celeb .ring-x{width:150px;height:150px;border:2px solid var(--accent2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:64px;font-weight:700;color:var(--fg);animation:pulse 2s infinite;background:rgba(37,228,255,.06)}
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.boot{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--dim)}
.boot i{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:spin 1s linear infinite}
.onb{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:20px}
.hero{font-family:var(--f-disp);font-size:34px;font-weight:700;letter-spacing:.06em;line-height:1.05;color:var(--fg)}
.hero em{font-style:normal;color:var(--accent2);text-shadow:0 0 22px var(--glow)}

/* modo independente */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

<script>
/* ============ DADOS ESTÁTICOS ============ */
const GROUPS=['Peito','Costas','Ombros','Braços','Pernas','Glúteos','Panturrilhas','Core','Condicionamento','Mobilidade'];
const EQUIP=[['academia','Academia completa'],['halteres','Halteres'],['barra','Barra e anilhas'],['elastico','Elásticos'],['corpo','Só o peso do corpo']];
// [id, nome, grupo, secundários, equipamentos aceitos, nível 1-3, modo (r=reps, s=segundos, m=minutos), tipo (c=composto, i=isolado), execução, erros comuns, cuidados, articulações sensíveis]
const EXR=[
['supino-reto-barra','Supino reto com barra','Peito','Tríceps, ombros (porção frontal)',['barra','academia'],2,'r','c','Deite com os olhos sob a barra, pés firmes no chão e escápulas juntas. Desça a barra com controle até tocar de leve o peito e empurre até estender os cotovelos.','Quicar a barra no peito, abrir demais os cotovelos, tirar o quadril do banco.','Use suportes de segurança ou um parceiro. Não trave a carga sem apoio.','ombro'],
['supino-reto-halteres','Supino reto com halteres','Peito','Tríceps, ombros (porção frontal)',['halteres','academia'],1,'r','c','Deitado, segure os halteres na altura do peito, punhos alinhados aos cotovelos. Empurre para cima aproximando os halteres e desça devagar até sentir o peito alongar.','Descer rápido demais, deixar os punhos dobrarem, arquear a lombar de forma exagerada.','Comece leve para aprender a trajetória. Ao terminar, apoie os halteres nas coxas antes de soltar.','ombro'],
['supino-maquina','Supino na máquina','Peito','Tríceps, ombros (porção frontal)',['academia'],1,'r','c','Ajuste o banco para que as pegadas fiquem na altura do meio do peito. Empurre sem tirar as costas do encosto e retorne devagar.','Ombros subindo até as orelhas, tirar as costas do encosto.','Ajuste o assento antes da primeira série.','ombro'],
['supino-inclinado-halteres','Supino inclinado com halteres','Peito','Ombros (porção frontal), tríceps',['halteres','academia'],2,'r','c','Banco entre 25° e 35°. Empurre os halteres em arco leve até quase se encontrarem acima do peito e desça com controle.','Banco muito inclinado (vira exercício de ombro), cotovelos abertos a 90° em relação ao tronco.','Não deixe os halteres caírem para trás ao final da série.','ombro'],
['flexao','Flexão de braço','Peito','Tríceps, ombros, core',['corpo'],1,'r','c','Mãos um pouco mais abertas que os ombros, corpo em linha reta. Desça o peito até perto do chão e empurre. Apoie os joelhos ou as mãos em um banco para facilitar.','Quadril caindo ou subindo, cabeça projetada à frente, amplitude curta.','Se sentir o punho incomodar, apoie nos punhos fechados ou use apoios de flexão.','punho'],
['crucifixo-maquina','Crucifixo na máquina (peck deck)','Peito','Ombros (porção frontal)',['academia'],1,'r','i','Costas apoiadas, cotovelos levemente flexionados. Aproxime os braços à frente do peito e volte devagar até sentir o alongamento.','Usar impulso, ombros subindo, carga alta que reduz a amplitude.','Não force o final da amplitude se sentir desconforto no ombro.','ombro'],
['crossover-cabo','Crossover no cabo','Peito','Ombros (porção frontal)',['academia'],2,'r','i','Um passo à frente, tronco levemente inclinado. Traga as mãos até se encontrarem à frente do tronco com cotovelos levemente dobrados.','Balançar o tronco, puxar com os braços em vez de aproximar os braços.','Carga moderada; priorize o controle.','ombro'],
['puxada-frente','Puxada na frente (pulley)','Costas','Bíceps, ombros (porção posterior)',['academia'],1,'r','c','Pegada um pouco mais aberta que os ombros. Puxe a barra até a parte alta do peito levando os cotovelos para baixo e para trás. Retorne com o braço estendido sob controle.','Inclinar o tronco muito para trás, puxar com o impulso, a barra passando atrás da nuca.','Não puxe a barra atrás da nuca. Ajuste o apoio de coxas.','ombro'],
['barra-fixa','Barra fixa','Costas','Bíceps, core',['academia'],3,'r','c','Pegada pouco além dos ombros, comece com os braços estendidos e suba até o queixo passar da barra, levando o peito em direção a ela. Desça de forma controlada.','Balançar o corpo, meia amplitude, ombros encolhidos.','Se ainda não consegue fazer repetições completas, use a puxada na frente ou a versão com elástico de assistência.','ombro'],
['remada-sentada-cabo','Remada sentada no cabo','Costas','Bíceps, ombros (porção posterior)',['academia'],1,'r','c','Sentado, tronco ereto. Puxe o triângulo ou a barra até o abdome, aproximando as escápulas, e retorne sem perder a postura.','Balançar o tronco, encolher os ombros, arredondar a lombar.','Mantenha a coluna neutra durante toda a série.','lombar'],
['remada-unilateral-halter','Remada unilateral com halter','Costas','Bíceps, core',['halteres','academia'],1,'r','c','Apoie uma mão e um joelho no banco. Puxe o halter em direção ao quadril, mantendo o tronco estável, e desça devagar.','Girar o tronco, puxar com o ombro em vez das costas.','Mantenha a coluna alinhada, sem girar.','lombar'],
['remada-curvada-barra','Remada curvada com barra','Costas','Bíceps, lombar, posterior de coxa',['barra','academia'],2,'r','c','Quadril para trás, tronco inclinado cerca de 45° com coluna neutra. Puxe a barra até a altura do umbigo e desça com controle.','Arredondar a coluna, usar impulso, carga acima da capacidade técnica.','Se sentir a lombar incomodar, troque por uma remada apoiada.','lombar'],
['remada-elastico','Remada com elástico','Costas','Bíceps, ombros (porção posterior)',['elastico'],1,'r','c','Prenda o elástico à frente na altura do peito, afaste-se até tensionar e puxe até o abdome aproximando as escápulas.','Encolher os ombros, deixar o elástico escapar rápido na volta.','Verifique se o elástico não tem desgaste e está bem preso.',''],
['desenvolvimento-halteres','Desenvolvimento com halteres','Ombros','Tríceps, parte superior do peito',['halteres','academia'],2,'r','c','Sentado com apoio, halteres na altura das orelhas. Empurre para cima sem arquear a lombar e desça até a altura do queixo.','Arquear a lombar, descer pouco, usar impulso das pernas.','Controle a descida. Se sentir pinçamento no ombro, reduza a amplitude e converse com um profissional.','ombro'],
['desenvolvimento-maquina','Desenvolvimento na máquina','Ombros','Tríceps',['academia'],1,'r','c','Ajuste o assento para que as pegadas fiquem na altura dos ombros. Empurre e retorne devagar sem bater os pesos.','Ombros encolhidos, lombar muito arqueada.','Ajuste a altura do banco antes de começar.','ombro'],
['elevacao-lateral','Elevação lateral','Ombros','Trapézio superior',['halteres','academia','elastico'],1,'r','i','Em pé, cotovelos levemente flexionados. Eleve os braços pelos lados até a altura dos ombros, com o polegar um pouco abaixo do mindinho, e desça devagar.','Balançar o tronco, subir acima dos ombros, usar carga alta.','Cargas leves bastam. Pare se sentir pontada no ombro.','ombro'],
['crucifixo-inverso','Crucifixo inverso','Ombros','Costas (parte alta)',['halteres','academia'],2,'r','i','Inclinado à frente ou na máquina de peck deck invertido. Abra os braços até a linha do tronco mantendo os cotovelos levemente flexionados.','Usar impulso, puxar com as costas em vez do ombro posterior.','Carga leve e controle.','ombro'],
['face-pull','Face pull','Ombros','Costas (parte alta), manguito rotador',['academia','elastico'],1,'r','i','Cabo ou elástico na altura do rosto. Puxe em direção ao rosto abrindo os cotovelos para os lados e finalize com as mãos ao lado das orelhas.','Inclinar o tronco para trás, puxar só com os bíceps.','Use carga leve; é um exercício de controle.','ombro'],
['rosca-halteres','Rosca direta com halteres','Braços','Antebraço',['halteres','academia'],1,'r','i','Em pé, cotovelos junto ao corpo. Flexione os cotovelos girando as palmas para cima e desça devagar até estender o braço.','Balançar o tronco, levar os cotovelos para frente, descer de uma vez.','Evite usar o impulso da lombar.',''],
['rosca-direta-barra','Rosca direta com barra','Braços','Antebraço',['barra','academia'],1,'r','i','Em pé, barra com pegada na largura dos ombros. Flexione os cotovelos sem mover o tronco e desça com controle.','Jogar o quadril, cotovelos fugindo para frente.','Se os punhos incomodarem, use a barra W.','punho'],
['rosca-martelo','Rosca martelo','Braços','Antebraço, braquial',['halteres','academia'],1,'r','i','Pegada neutra (palmas voltadas uma para a outra). Flexione os cotovelos mantendo o braço junto ao corpo.','Balançar o tronco, ombros à frente.','Carga que permita controle em todas as repetições.',''],
['triceps-corda','Tríceps na corda (pulley)','Braços','—',['academia','elastico'],1,'r','i','Cotovelos junto ao corpo, estenda os braços abrindo a corda no final e retorne até a altura do peito.','Levantar os cotovelos, inclinar o tronco para empurrar com o peso do corpo.','Mantenha os cotovelos parados.','cotovelo'],
['triceps-testa','Tríceps testa','Braços','—',['barra','halteres','academia'],2,'r','i','Deitado, braços apontados para cima. Flexione só os cotovelos levando a carga em direção à testa e estenda de volta.','Abrir os cotovelos, mover os ombros.','Comece leve: os cotovelos são sensíveis a carga excessiva.','cotovelo'],
['mergulho-banco','Mergulho no banco','Braços','Peito, ombros',['corpo'],2,'r','c','Mãos no banco atrás do corpo, pernas estendidas ou dobradas. Flexione os cotovelos até cerca de 90° e empurre de volta.','Ombros subindo, descer demais, afastar o quadril do banco.','Pare se sentir desconforto na frente do ombro. A versão com joelhos dobrados é mais fácil.','ombro'],
['agachamento-livre','Agachamento livre com barra','Pernas','Glúteos, core, lombar',['barra','academia'],2,'r','c','Barra apoiada nas costas, pés na largura dos ombros. Desça sentando o quadril para trás e para baixo mantendo o tronco firme e os joelhos na direção dos pés. Suba empurrando o chão.','Joelhos entrando, calcanhar saindo do chão, arredondar a lombar.','Use suportes de segurança. Aprenda a técnica com carga leve ou peça avaliação presencial.','joelho,lombar'],
['agachamento-goblet','Agachamento goblet','Pernas','Glúteos, core',['halteres','academia'],1,'r','c','Segure um halter junto ao peito. Desça com o tronco ereto até onde mantiver a coluna neutra e suba empurrando o chão.','Joelhos para dentro, tronco caindo à frente.','Carga leve para aprender o padrão do movimento.','joelho'],
['agachamento-corpo','Agachamento com peso do corpo','Pernas','Glúteos, core',['corpo'],1,'r','c','Pés na largura dos ombros, braços à frente. Desça sentando para trás e suba firme.','Calcanhares saindo do chão, joelhos entrando.','Se necessário, agache até um banco como referência.','joelho'],
['leg-press','Leg press','Pernas','Glúteos',['academia'],1,'r','c','Pés na largura dos ombros na plataforma. Desça até os joelhos flexionarem cerca de 90° sem levantar o quadril do banco e empurre sem travar os joelhos.','Quadril saindo do banco, travar os joelhos, amplitude curta com carga excessiva.','Nunca trave os joelhos no final. Ajuste o encosto antes de começar.','joelho'],
['cadeira-extensora','Cadeira extensora','Pernas','—',['academia'],1,'r','i','Ajuste o encosto, estenda os joelhos até quase alinhar a perna e desça devagar.','Usar impulso, chutar a carga.','Se sentir dor na frente do joelho, reduza a carga ou a amplitude.','joelho'],
['mesa-flexora','Mesa flexora','Pernas','Panturrilhas',['academia'],1,'r','i','Deitado, flexione os joelhos levando os calcanhares em direção ao glúteo e retorne devagar.','Levantar o quadril, balançar.','Carga moderada, movimento fluido.',''],
['stiff-halteres','Stiff com halteres','Pernas','Glúteos, lombar',['halteres','academia'],2,'r','c','Joelhos levemente flexionados, empurre o quadril para trás deslizando os halteres junto às pernas até sentir a parte de trás da coxa alongar. Suba contraindo glúteos.','Arredondar a coluna, dobrar demais os joelhos.','Mantenha a coluna neutra e vá só até onde a técnica se sustenta.','lombar'],
['stiff-barra','Stiff com barra','Pernas','Glúteos, lombar',['barra','academia'],2,'r','c','Mesma ideia do stiff com halteres, com a barra junto às pernas. Empurre o quadril para trás e retorne.','Arredondar a coluna, barra longe do corpo.','Aumente a carga com cautela.','lombar'],
['afundo','Afundo','Pernas','Glúteos, core',['corpo'],1,'r','c','Dê um passo à frente e desça o joelho de trás em direção ao chão, tronco ereto. Empurre com a perna da frente para voltar.','Joelho da frente passando muito dos pés, passada curta.','Se perder o equilíbrio, apoie uma mão em uma parede.','joelho'],
['agachamento-bulgaro','Agachamento búlgaro','Pernas','Glúteos, core',['corpo'],3,'r','c','Pé de trás apoiado em um banco, desça o joelho de trás em direção ao chão com o tronco firme e suba pela perna da frente.','Pé da frente muito perto do banco, joelho entrando.','Exercício exigente em equilíbrio. Comece sem carga.','joelho'],
['elevacao-pelvica','Elevação pélvica','Glúteos','Posterior de coxa, core',['corpo'],1,'r','c','Costas apoiadas em um banco ou no chão, joelhos a 90°. Suba o quadril contraindo os glúteos até o tronco alinhar com as coxas e desça devagar.','Arquear a lombar no topo, empurrar com os dedos dos pés.','Mantenha o queixo levemente recolhido e as costelas baixas.','lombar'],
['gluteo-cabo','Coice no cabo','Glúteos','Posterior de coxa',['academia'],2,'r','i','Tornozeleira presa ao cabo baixo. Leve a perna para trás sem girar o quadril e volte controlando.','Arquear a lombar, balançar.','Carga leve e movimento controlado.','lombar'],
['panturrilha-em-pe','Panturrilha em pé','Panturrilhas','—',['corpo'],1,'r','i','Na ponta de um degrau (ou no chão), suba o máximo que conseguir, segure um instante e desça devagar até alongar.','Movimento curto, quicar.','Use um apoio para equilíbrio.',''],
['panturrilha-sentado','Panturrilha sentado','Panturrilhas','—',['academia','halteres'],1,'r','i','Sentado, carga sobre os joelhos. Suba nas pontas dos pés e desça alongando bem.','Movimento curto, usar impulso.','Posicione a carga com cuidado sobre as coxas.',''],
['prancha','Prancha','Core','Ombros, glúteos',['corpo'],1,'s','c','Apoie antebraços e pontas dos pés, corpo em linha reta da cabeça aos calcanhares. Respire normalmente e mantenha o abdome firme.','Quadril caindo ou muito alto, prender a respiração.','Pare se a lombar incomodar. Faça no joelho se necessário.','lombar'],
['dead-bug','Dead bug','Core','Flexores do quadril',['corpo'],1,'r','c','Deitado, braços e joelhos a 90° para cima. Estenda braço e perna opostos devagar sem perder o contato da lombar com o chão e alterne.','Lombar descolando do chão, movimento rápido.','Reduza a amplitude se a lombar sair do chão.',''],
['abdominal-supra','Abdominal supra','Core','—',['corpo'],1,'r','i','Deitado, joelhos dobrados, mãos ao lado da cabeça. Suba só as escápulas do chão contraindo o abdome e desça devagar.','Puxar a cabeça com as mãos, subir o tronco inteiro.','Pescoço relaxado.','' ],
['elevacao-pernas','Elevação de pernas','Core','Flexores do quadril',['corpo'],2,'r','c','Deitado, lombar firme no chão. Eleve as pernas até 90° e desça controlando sem encostar no chão.','Lombar arqueando, balançar.','Dobre os joelhos para facilitar se a lombar sair do chão.','lombar'],
['esteira','Esteira (caminhada ou trote leve)','Condicionamento','Pernas',['academia'],1,'m','c','Ritmo em que consiga conversar em frases curtas. Aumente o tempo aos poucos ao longo das semanas.','Segurar nas barras o tempo todo, passada muito longa.','Interrompa se sentir tontura, dor no peito ou falta de ar fora do normal e procure avaliação médica.',''],
['bicicleta','Bicicleta ergométrica','Condicionamento','Pernas',['academia'],1,'m','c','Banco na altura do quadril, pedalada contínua em ritmo confortável.','Banco baixo demais, resistência alta com cadência muito baixa.','Ajuste o banco para não forçar os joelhos.','joelho'],
['caminhada','Caminhada ao ar livre','Condicionamento','Pernas',['corpo'],1,'m','c','Passo firme, postura alta. Escolha locais seguros e iluminados.','Usar calçado inadequado.','Hidrate-se e observe o clima.',''],
['polichinelo','Polichinelo','Condicionamento','Corpo todo',['corpo'],1,'s','c','Salte abrindo pernas e braços e volte à posição inicial em ritmo constante.','Aterrissar com joelhos travados.','Se tiver dor nos joelhos, opte por caminhada no lugar.','joelho'],
['mob-gato-camelo','Gato-camelo','Mobilidade','Coluna',['corpo'],1,'s','c','De quatro apoios, arredonde a coluna e depois estenda devagar, sincronizando com a respiração.','Movimento rápido.','Vá até onde for confortável.',''],
['mob-quadril-90','Rotação de quadril 90/90','Mobilidade','Quadril',['corpo'],1,'s','c','Sentado com as duas pernas a 90°, gire o tronco e alterne os lados com controle.','Forçar até sentir dor.','Respeite o limite do movimento.','joelho'],
['mob-toracica','Rotação torácica','Mobilidade','Coluna torácica',['corpo'],1,'s','c','De lado ou de quatro apoios, uma mão atrás da cabeça. Gire o tronco abrindo o cotovelo para cima e volte.','Mover a lombar em vez da parte média das costas.','Movimento lento.',''],
['mob-ombro','Círculos de ombro com elástico/bastão','Mobilidade','Ombros',['corpo'],1,'s','c','Segure um elástico ou bastão com as mãos afastadas e passe-o por cima da cabeça até atrás do corpo, sem forçar.','Largura muito curta, dor no ombro.','Aumente a pegada se sentir desconforto.','ombro'],
['mob-tornozelo','Mobilidade de tornozelo','Mobilidade','Panturrilhas',['corpo'],1,'s','c','Com o pé apoiado perto de uma parede, leve o joelho em direção à parede sem tirar o calcanhar do chão.','Calcanhar levantando.','Vá devagar.',''],
['mob-isquios','Alongamento de posterior de coxa','Mobilidade','Posterior de coxa',['corpo'],1,'s','c','Sentado ou em pé, com uma perna estendida, incline o tronco à frente com a coluna longa até sentir alongar, sem dor.','Arredondar a coluna, balançar.','Desconforto leve é normal; dor, não.','lombar']
];

 const L=levelOf(m.xp);m.lvl=L.lvl;m.into=L.into;m.need=L.need;

 m.setsDone=0;m.vol=0;
 m.done.forEach(s=>s.exs.forEach(e=>e.sets.forEach(t=>{if(t.done){m.setsDone++;if(e.m==='r')m.vol+=(n0(t.kg)||0)*(n0(t.reps)||0)}})));

function pickEx(slot,used,P){

function prescribe(ex,P){

const e1=(kg,r)=>kg*(1+r/30);

function lastPerf(exId,beforeTs){
 const out=[];const ds=X().done;
 for(let i=ds.length-1;i>=0&&out.length<4;i--){const s=ds[i];if(beforeTs&&s.start>=beforeTs)continue;
  const e=s.exs.find(x=>x.id===exId);if(!e)continue;
  const sets=e.sets.filter(t=>t.done&&n0(t.reps)>0);if(!sets.length)continue;
  const rp=sets.map(t=>t.rpe).filter(v=>v!=null);
  out.push({date:s.date,sets,rpe:rp.length?avg(rp):null,sid:s.id})}
 return out}
function readiness(){
 const t=today(),y=addD(t,-1);const r=S.recovery[t]||S.recovery[y];const sl=S.sleep[t];const why=[];
 if(r&&(r.fatigue>=4))why.push('fadiga alta registrada');
 if(r&&r.pain)why.push('dor ou desconforto registrado');
 if(sl&&sl.h&&sl.h<6)why.push('sono curto na última noite ('+fnum(sl.h,1)+' h)');
 return{low:why.length>0,why}}
function suggest(exId,pl){
 const ex=EX[exId];if(!ex||ex.m!=='r')return null;
 const h=lastPerf(exId);const rmin=pl.rmin,rmax=pl.rmax;
 if(!h.length)return{kind:'first',kg:null,msg:'Primeira vez aqui: comece leve, com carga que permita cerca de '+rmax+' repetições e deixe 2 a 3 repetições de reserva.',why:'Sem histórico deste exercício, o sistema não sugere uma carga. Registrar as séries cria a base para as próximas sugestões.'};
 const last=h[0];const kgs=last.sets.map(s=>n0(s.kg)||0);const top=Math.max.apply(null,kgs);
 const allTop=last.sets.every(s=>n0(s.reps)>=rmax);const allMin=last.sets.every(s=>n0(s.reps)>=rmin);const rpe=last.rpe;
 const rd=readiness();let plateau='';
 if(h.length>=3){const b=h.map(o=>Math.max.apply(null,o.sets.map(s=>e1(n0(s.kg)||0,n0(s.reps)||0))));
  if(b[0]<=b[2]*1.01&&b[1]<=b[2]*1.01)plateau='Os últimos treinos ficaram parecidos. Isso é comum e não indica problema: dormir bem, variar o exercício ou manter a carga por mais uma semana costuma ajudar.'}
 if(rd.low)return{kind:'hold',kg:top,msg:'Hoje, mantenha as cargas ('+rd.why.join(', ')+').',why:'O sistema não sugere aumentos quando você registrou sinais de baixa recuperação. Forçar progressão nesses dias não compensa.',plateau};
 if(top===0){return{kind:'reps',kg:0,msg:allTop?'Você completou '+rmax+' repetições em todas as séries. Tente uma variação mais difícil ou mais repetições com boa técnica.':'Busque +1 repetição por série mantendo a técnica.',why:'Exercício sem carga externa: a progressão vem de repetições ou de variações mais difíceis.',plateau}}
 if(allTop&&(rpe===null||rpe<=8.5)){
  const low=lowerG.includes(ex.g);

 for(let i=0;i<n;i++){
  const ps=prev?(prev.sets[i]||prev.sets[prev.sets.length-1]):null;
  let kg='',reps='';

   if(ps){kg=n0(ps.kg);reps=n0(ps.reps)}else reps=it.rmin;

   if(mode==='leve'&&kg)kg=Math.round(kg*0.9*2)/2;
   if(kg==null)kg=''
  }else{reps=ps?n0(ps.reps):it.rmax}
  sets.push({kg:kg,reps:reps,rpe:null,done:false,rest:null})}

function finishSession(id,opts){
 opts=opts||{};const s=S.sessions[id];if(!s||s.status!=='active')return null;
 s.end=Date.now();s.status='done';s.pain=!!opts.pain;s.dur=s.end-s.start;
 const planned=s.exs.reduce((a,e)=>a+e.plan.sets,0);const done=s.exs.reduce((a,e)=>a+e.sets.filter(t=>t.done).length,0);
 s.planned=planned;s.doneSets=done;
 const res={xp:[],notes:[],prs:[]};
 // recordes pessoais
 s.exs.forEach(e=>{if(e.m!=='r')return;
  const valid=e.sets.filter(t=>t.done&&n0(t.kg)>0&&n0(t.reps)>=1&&n0(t.reps)<=12&&t.rpe!==10);if(!valid.length)return;
  let best=null;valid.forEach(t=>{const v=e1(n0(t.kg),n0(t.reps));if(!best||v>best.v)best={v,t}});
  const prev=S.prs.filter(p=>p.ex===e.id).reduce((a,p)=>Math.max(a,p.e1),0);
  const rec={ex:e.id,name:e.name,date:s.date,kg:n0(best.t.kg),reps:n0(best.t.reps),rpe:best.t.rpe,e1:Math.round(best.v*10)/10,sid:s.id,ctx:s.wname};
  if(!prev){rec.base=true;S.prs.push(rec)}
  else if(best.v>prev*1.005){S.prs.push(rec);res.prs.push(rec)}});
  // XP
 const valid=done>=1&&done>=Math.ceil(planned*0.5)&&s.dur>=8*60e3;
 const wk=wkStart(s.date);const m0=(X(),null);
 ver++;memo.ver=-1;const m=X();
 const sameDay=m.done.some(o=>o.id!==s.id&&o.date===s.date&&o.xpOk);
 const weekXp=m.done.filter(o=>o.id!==s.id&&wkStart(o.date)===wk&&o.xpOk).length;
 if(!valid){res.notes.push('Sessão salva no histórico sem XP: ela precisa de pelo menos metade das séries previstas e 8 minutos.')}
 else if(sameDay){res.notes.push('Você já recebeu XP de treino hoje. Esta sessão ficou salva, sem XP extra.')}
 else if(weekXp>=perWeek()){res.notes.push('Você já cumpriu os treinos planejados desta semana. Sessões extras ficam salvas, sem XP: descansar também é evoluir.')}
 else{
  s.xpOk=true;ver++;memo.ver=-1;
  if(award('w:'+s.id,60,'Treino concluído: '+s.wname,'treino'))res.xp.push(['Treino concluído',60]);
  const reg=s.exs.reduce((a,e)=>a+e.sets.filter(t=>setIsReg(t,e)).length,0);
  if(done>0&&reg/done>=0.9&&award('wl:'+s.id,20,'Registro completo das séries','treino'))res.xp.push(['Registro completo',20])}
 s.res=res;
 return s}

const barH=(p,cls)=>'<div class="bar '+(cls||'')+'" role="progressbar" aria-valuenow="'+Math.round(p)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+clamp(p,0,100)+'%"></i></div>';
function ringH(p,big,small,sz,color){const s=sz||84,r=(s/2)-7,c=2*Math.PI*r;
 return '<div class="ring" style="--s:'+s+'px"><svg viewBox="0 0 '+s+' '+s+'"><circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" style="stroke:rgba(80,160,255,.16)" stroke-width="6"/><circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" style="stroke:'+(color||'var(--accent2)')+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-clamp(p,0,100)/100)+'"/></svg><b>'+big+(small?'<small>'+small+'</small>':'')+'</b></div>'}
const rankB=(i,lg)=>{const k=RANKS[i].k;return '<span class="rankb'+(lg?' lg':'')+'" title="Rank '+esc(k)+'"><span>'+(k==='Nacional'?'N':esc(k))+'</span></span>'};
const subs=(g,list)=>'<div class="sub" role="tablist">'+list.map(x=>'<button role="tab" data-act="sub" data-g="'+g+'" data-v="'+x[0]+'" aria-current="'+(U.sub[g]===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
const empty=(ik,t,d,btn)=>'<div class="empty">'+ic(ik)+'<div class="disp" style="font-size:16px;color:var(--fg)">'+t+'</div><div class="small">'+d+'</div>'+(btn||'')+'</div>';
const fmtAx=v=>v>=1000?fnum(v/1000,v%1000?1:0)+'k':fnum(v,v<10&&v%1?1:0);
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function barChart(vals,labels,o){o=o||{};const W=320,H=o.h||150,L=36,R=6,T=8,B=22,iw=W-L-R,ih=H-T-B;const mx=niceMax(Math.max.apply(null,vals.concat([0])));const n=vals.length,bw=iw/n;let g='';
 [0,.5,1].forEach(f=>{const y=T+ih-ih*f;g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+fmtAx(mx*f)+'</text>'});
 const step=Math.ceil(n/7);
 vals.forEach((v,i)=>{const h=ih*v/mx,x=L+i*bw+bw*.18;g+='<rect x="'+x+'" y="'+(T+ih-h)+'" width="'+bw*.64+'" height="'+(v>0?Math.max(h,1.5):0)+'" rx="1.5" style="fill:'+(o.color||'var(--accent)')+'"/>';
  if(i%step===0)g+='<text x="'+(x+bw*.32)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(labels[i])+'</text>'});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Gráfico de barras')+'">'+g+'</svg>'}
function lineChart(pts,o){o=o||{};const W=320,H=o.h||150,L=36,R=10,T=10,B=22,iw=W-L-R,ih=H-T-B;
 if(!pts.length)return '';const vs=pts.map(p=>p.v);let lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);if(lo===hi){lo-=1;hi+=1}const pad2=(hi-lo)*.15;lo=Math.max(0,lo-pad2);hi=hi+pad2;
 const X=i=>L+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=v=>T+ih-ih*(v-lo)/(hi-lo);let g='';
 [0,.5,1].forEach(f=>{const y=T+ih-ih*f,v=lo+(hi-lo)*f;g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+fnum(v,hi-lo<10?1:0)+'</text>'});
 const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const gid='lg'+Math.random().toString(36).slice(2,6);
 g+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent2);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent2);stop-opacity:0"/></linearGradient></defs>';
 if(pts.length>1)g+='<path d="'+path+' L'+X(pts.length-1).toFixed(1)+' '+(T+ih)+' L'+X(0).toFixed(1)+' '+(T+ih)+'Z" style="fill:url(#'+gid+')"/><path d="'+path+'" fill="none" style="stroke:var(--accent2)" stroke-width="2" stroke-linejoin="round"/>';
 pts.forEach((p,i)=>{g+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(i===pts.length-1?4.5:2.5)+'" style="fill:'+(i===pts.length-1?'var(--accent2)':'var(--accent)')+'"/>'});
 const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
 idx.forEach(i=>{g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(i===0&&pts.length>1?'start':i===pts.length-1&&pts.length>1?'end':'middle')+'">'+esc(pts[i].l)+'</text>'});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Gráfico de linha')+'">'+g+'</svg>'}

  +(nr!==null?'<div class="small dim" style="margin-top:10px">Próximo rank (<b>'+RANKS[nr].k+'</b>): '+rankNeeds(nr).map(x=>'<span class="'+(x.ok?'':'')+'" style="'+(x.ok?'color:var(--good)':'')+'">'+(x.ok?'✓ ':'')+x.t+'</span>').join(' · ')+'</div>':'')+'</div>';

 else if(nw){const tr=isTrainDay(t);
  h+='<div class="panel col"><div class="pt"><h4>'+(doneToday?'Treino de hoje concluído':tr?'Treino de hoje':'Hoje é dia de recuperação')+'</h4>'+(doneToday?'<span class="pill ok">Feito</span>':'')+'</div>'
  +'<div class="disp" style="font-size:20px">'+esc(nw.name)+'</div><div class="small dim">'+esc(nw.focus)+' · '+nw.exs.length+' exercícios · cerca de '+estMin(nw)+' min</div>'
  +(!tr&&!doneToday?'<div class="note">Dia sem treino planejado. Descansar, dormir bem e se alimentar são parte da evolução. Se quiser treinar, o plano está disponível.</div>':'')
  +'<div class="row"><button class="btn pri grow" data-act="goTrain">'+(doneToday?'Ver treinos':'Abrir treino')+'</button><button class="btn" data-act="startNow" data-w="'+nw.id+'">Modo treino</button></div></div>'}
 // missão principal

function toggle(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}
function setSetField(f,v){const s=activeSession();if(!s)return;const st=curSet(s)[1];st[f]=v;save({sess:s.id})}
function lvDone(){
 const s=activeSession();if(!s)return;const e=s.exs[s.cur.e],st=e.sets[s.cur.s],ex=EX[e.id];
 if(!(n0(st.reps)>0)){toast('warn','Falta registrar','Informe as repetições ou o tempo antes de concluir a série.','alert');return}
 if(ex.m==='r'&&(st.kg===''||st.kg==null)){if(ex.eq.includes('corpo'))st.kg=0;else{toast('warn','Falta a carga','Informe a carga em kg. Use 0 para o peso do corpo.','alert');return}}
 const wasDone=st.done;st.done=true;
 if(!wasDone){const now=Date.now();if(s.lastDone&&s.lastEx===s.cur.e&&now-s.lastDone<1800000)st.rest=Math.round((now-s.lastDone)/1000);s.lastDone=now;s.lastEx=s.cur.e;
  const nxt=e.sets[s.cur.s+1]?{e:s.cur.e,s:s.cur.s+1}:{e:s.cur.e+1,s:0};if(s.exs[nxt.e])s.cur=nxt;const nu=nextUndone(s);
  beep([[660,.07],[880,.1]]);vib(30);
  if(nu){s.cur=nu;const rest=ex.m==='m'?0:(e.plan.rest||(ex.m==='s'?45:60));s.timer=rest?{dur:rest,end:Date.now()+rest*1000,paused:false,left:0}:null}
  else{s.timer=null;toast('good','Todas as séries concluídas','Toque em Encerrar treino para ver o relatório.','flag');beep([[784,.1],[988,.1],[1175,.2]])}}
 save({sess:s.id});render()}
function lvTimer(v){
 const s=activeSession();if(!s)return;const e=s.exs[s.cur.e];
 if(v==='start'){const r=e.plan.rest||60;s.timer={dur:r,end:Date.now()+r*1000,paused:false,left:0}}
 else if(!s.timer)return;
 else if(v==='toggle'){const t=s.timer;if(t.paused){t.end=Date.now()+t.left;t.paused=false}else{t.left=Math.max(0,t.end-Date.now());t.paused=true}}
 else if(v==='15'||v==='-15'){const d=Number(v)*1000;const t=s.timer;if(t.paused)t.left=Math.max(0,t.left+d);else t.end+=d;t.dur=Math.max(1,t.dur+Number(v));t.fired=false}
 else if(v==='reset'){const t=s.timer;t.end=Date.now()+t.dur*1000;t.paused=false;t.fired=false}
 else if(v==='skip')s.timer=null;
 save({sess:s.id});render()}

 case'foodPort':U.modal.g=String(v);render();break;
 case'foodSave':{const m=U.modal;const f=foodAll().find(x=>x.id===m.sel);const g=n0(m.g);if(!f||!(g>0))return;
  addFoodEntry(U.ndate,{meal:m.meal,name:f.n,g:g,u:'g',k:R1(f.k*g/100),p:R1(f.p*g/100),c:R1(f.c*g/100),f:R1(f.f*g/100),fi:R1((f.fi||0)*g/100),src:'base',fid:f.id});
  U.modal.sel=null;toast('good','Adicionado',f.n,'fork');commit({day:U.ndate});break}
 case'foodManual':{const m=U.modal,f=m.f||{};const name=(f.name||'').trim();const k=n0(f.k);if(!name||k==null||k<0){toast('warn','Falta informar','Preencha o nome e a energia em kcal.','alert');return}
  const q=n0(f.qty);addFoodEntry(U.ndate,{meal:m.meal,name,g:q||1,u:q?'g':'porção',k:R1(k),p:R1(n0(f.p)||0),c:R1(n0(f.c)||0),f:R1(n0(f.f)||0),fi:0,src:'manual'});
  if(f.keep&&q>0){S.customFoods.push({id:uid('cf'),n:name,k:R1(k/q*100),p:R1((n0(f.p)||0)/q*100),c:R1((n0(f.c)||0)/q*100),f:R1((n0(f.f)||0)/q*100),fi:0,pn:'',pg:q,custom:true})}
  U.modal.f={};toast('good','Adicionado',name,'fork');commit({day:U.ndate});break}
 case'foodDel':{const d=el.dataset.d;S.food[d]=(S.food[d]||[]).filter(e=>e.id!==v);if(!S.food[d].length)delete S.food[d];commit({day:d});break}
 case'mealSave':openModal({t:'savemeal',meal:v,q:''});break;
 case'mealSaveGo':{const m=U.modal;const items=dayFood(U.ndate).filter(e=>e.meal===m.meal).map(e=>{const c=clone(e);delete c.id;delete c.ts;return c});S.saved.push({id:uid('sv'),name:m.q.trim(),items});U.modal=null;toast('good','Refeição salva',m.q.trim(),'check');save();render();break}
 case'savedAdd':{const x=S.saved.find(y=>y.id===v);if(!x)return;x.items.forEach(i=>addFoodEntry(U.ndate,Object.assign(clone(i),{meal:U.modal.meal})));U.modal=null;toast('good','Refeição adicionada',x.name,'fork');commit({day:U.ndate});break}
 case'savedDel':S.saved=S.saved.filter(x=>x.id!==v);save();render();break;
 case'ideaM':U.ideaM=v;render();break;
 case'ideaT':U.ideaT=Number(v);render();break;
 case'ideaC':U.ideaC=Number(v);render();break;
 case'dayPlan':{const diet=(S.profile.diet)||[];const ok=i=>diet.every(d=>d==='nuts'?!i.tags.includes('nuts'):i.tags.includes(d));const pl={};['cafe','almoco','lanche','jantar'].forEach(m=>{const L=IDEAS.filter(i=>i.m===m&&ok(i));if(L.length)pl[m]=L[Math.floor(Math.random()*L.length)].id});U.dayPlan=pl;render();break}
 case'dayShop':Object.values(U.dayPlan||{}).forEach(id=>shopFrom(id));save();render();toast('good','Lista atualizada','Ingredientes adicionados.','check');break;
 case'ideaShop':shopFrom(v);save();render();toast('good','Lista atualizada','Ingredientes adicionados.','check');break;
 case'shopAdd':{const t=(U.shopNew||'').trim();if(!t)return;S.shop.push({id:uid('sh'),t,done:false});U.shopNew='';save();render();break}
 case'shopTog':{const x=S.shop.find(y=>y.id===v);if(x){x.done=!x.done;save();render()}break}
 case'shopDel':S.shop=S.shop.filter(x=>x.id!==v);save();render();break;
 case'shopClear':S.shop=S.shop.filter(x=>!x.done);save();render();break;
 case'sleepOpen':openModal({t:'sleep',f:Object.assign({d:today(),bed:(S.profile.tBed||''),wake:(S.profile.tWake||''),q:null},{})});break;
 case'sleepSave':{const f=U.modal.f;const h=sleepHours(f.bed,f.wake);S.sleep[f.d]={bed:f.bed,wake:f.wake,h,q:f.q};U.modal=null;toast('good','Sono registrado',fnum(h,1)+' h','bed');commit({day:f.d});break}
 case'recOpen':openModal({t:'recov',f:Object.assign({en:null,fatigue:null,pain:false,note:''},S.recovery[today()]||{})});break;
 case'recSave':{const f=U.modal.f;S.recovery[today()]={en:f.en,fatigue:f.fatigue,pain:!!f.pain,note:f.note||''};U.modal=null;toast('good','Check-in salvo','','moon');commit({day:today()});break}
 case'barLookup':barLookup((U.modal.f||{}).code);break;
 case'barScan':barScan();break;
 case'notifOn':try{Notification.requestPermission().then(()=>render())}catch(e){}break;
 case'install':if(U.inst){U.inst.prompt();U.inst=null;render()}break;
 case'mfSet':U.modal.f[el.dataset.k]=Number(v);render();break;
 /* evolução */
 case'per':U.per.k=v;render();break;
 case'review':S.reviewed[wkStart(today())]=Date.now();commit();break;
 case'measOn':S.set.measures=true;save();render();break;
 case'measOff':S.set.measures=false;save();render();break;
 case'measOpen':openModal({t:'measure',f:{d:today()}});break;
 case'measSave':{const f=U.modal.f;const o={id:uid('me'),d:f.d||today()};['weight','waist','chest','arm','thigh'].forEach(k=>o[k]=n0(f[k]));if(!['weight','waist','chest','arm','thigh'].some(k=>o[k]!=null)){toast('warn','Nada informado','Preencha ao menos uma medida.','alert');return}S.measures.push(o);U.modal=null;save();render();break}
 case'measDel':S.measures=S.measures.filter(x=>x.id!==v);save();render();break;
 case'mnPick':U.mnQ=v;render();break;
 case'mnAsk':mnAsk();break;
 /* missões */
 case'chalStart':S.challenges.push({id:v,start:today()});toast('good',CHAL[v].n,'Começou hoje.','trophy');commit();break;
 /* estilo */
 case'cosTitle':S.cos.title=v;save();render();break;
 case'cosFrame':{const f=FRAMES.find(x=>x.id===v);if(!f.ok({lvl:X().lvl,rankI:X().rankI})){toast('info','Bloqueada',f.req,'lock');return}S.cos.frame=v;save();render();break}
 case'cosAv':S.cos.av=Number(v);save();render();break;
 case'cosSkin':S.cos.skin=v;save();render();break;
 /* dados */
 case'export':doExport();break;
 case'importOpen':U.importErr='';openModal({t:'import',f:{json:''}});break;
 case'importGo':importGo();break;
 case'wipeOpen':U.wipeErr='';openModal({t:'wipe',f:{word:''}});break;
 case'wipeGo':doWipe();break;
 case'mclose':closeModal();break;
 case'mback':if(ev.target===el)closeModal();break;
 case'confirmYes':{const m=U.modal;U.modal=null;if(m.run)m.run();render();break}
 }}
function shopFrom(id){const i=IDEAS.find(x=>x.id===id);if(!i)return;i.ing.forEach(t=>{if(!S.shop.some(x=>norm(x.t)===norm(t)&&!x.done))S.shop.push({id:uid('sh'),t,done:false})})}

/* ============ ENTRADAS ============ */
const NUMF=['age','height','weight'];
function onIn(el,ev){
 const k=el.dataset.in;const val=el.type==='checkbox'?el.checked:el.value;const ch=ev.type==='change';
 const p=k.split(':');
 if(p[0]==='onb'){const d=U.onb.d,f=p[1];if(f==='minutes'){d.minutes=Number(val);const l=$('#onb-min-v');if(l)l.textContent=d.minutes+' min';return}d[f]=val;if(f==='consent'||f==='age')render();return}
 if(p[0]==='pf'){const e=U.edit,f=p[1];if(f==='minutes'){e.minutes=Number(val);if(ch)render();return}e[f]=val;return}
 if(p[0]==='np'){U.modal.minutes=Number(val);if(ch)render();return}
 if(p[0]==='set'){const f=p[1];
  if(f==='calm'||f==='sound')S.set[f]=!!val;else if(f==='vol')S.set.vol=clamp(Number(val)/100,0,1);else if(f==='waterGoal'){const g=n0(val);if(g&&g>=500&&g<=6000)S.set.waterGoal=g;else if(!ch)return}else S.set[f]=val;
  save();if(f==='calm'||f==='sound'||(f==='vol'&&ch)||(f==='waterGoal'&&ch))render();return}
 if(p[0]==='plan'){const w=S.plan.workouts.find(x=>x.id===p[1]);const it=w&&w.exs[Number(p[2])];if(!it)return;const f=p[3];const lim={sets:[1,8],rmin:[1,100],rmax:[1,100],rest:[0,300]}[f];const n=n0(val);if(n==null)return;it[f]=clamp(Math.round(n),lim[0],lim[1]);
  if(it.rmin>it.rmax){if(f==='rmin'){it.rmax=it.rmin;const o=document.querySelector('[data-in="plan:'+p[1]+':'+p[2]+':rmax"]');if(o)o.value=it.rmax}else if(ev.type==='change'||el.type!=='number'){}}
  save();return}
 if(p[0]==='live'){const s=activeSession();if(!s)return;const f=p[1];
  if(f==='note'){s.exs[s.cur.e].note=val;save({sess:s.id});return}
  if(f==='snotes'){s.notes=val;save({sess:s.id});return}
  const st=curSet(s)[1];st[f]=val===''?'':n0(val);if(st[f]===null)st[f]='';save({sess:s.id});return}
 if(p[0]==='mf'){U.modal.f=U.modal.f||{};const f=p[1];U.modal.f[f]=el.type==='checkbox'?el.checked:(el.type==='number'?val:val);if(ch||el.type==='checkbox'||el.type==='time'||el.type==='date'||f==='word')render();return}
 if(p[0]==='per'){U.per[p[1]]=val;if(ch)render();return}
 switch(k){
  case'catQ':U.catQ=val;break;case'histQ':U.histQ=val;break;case'catMine':U.catMine=!!val;break;case'catFav':U.catFav=!!val;break;
  case'ideaHave':U.ideaHave=val;break;case'ideaAll':U.ideaAll=!!val;break;case'shopNew':U.shopNew=val;return;
  case'mnQ':U.mnQ=val;return;case'mnOk':U.mnOk=!!val;return;case'evEx':U.evEx=val;break;
  case'mq':U.modal.q=val;break;case'mg':U.modal.g=val;break;case'swApply':U.modal.apply=!!val;return;
 }
 render()}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;if(el.tagName==='INPUT'&&el.type==='checkbox')return;
 if(el.dataset.act!=='mback'&&el.classList.contains('mback'))return;
 act(el,ev)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='imp-file'&&el.files&&el.files[0]&&U.modal){const r=new FileReader();r.onload=()=>{U.modal.f={json:String(r.result)};U.importErr='';render()};r.onerror=()=>{U.importErr='Não consegui ler o arquivo.';render()};r.readAsText(el.files[0]);return}if(el.tagName==='INPUT'&&el.type==='checkbox'&&el.dataset.act){act(el,ev);return}if(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&(el.type==='text'||el.type==='number')))return;if(el.dataset&&el.dataset.in)onIn(el,ev)});
document.addEventListener('input',ev=>{const el=ev.target;if(!el.dataset||!el.dataset.in)return;if(el.type==='checkbox'||el.tagName==='SELECT')return;onIn(el,ev)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(U.modal)closeModal();else if(CQ.length||celebOn)nextCeleb()}
 if(ev.key==='Enter'&&ev.target.id==='shop-new'){ev.preventDefault();act({dataset:{act:'shopAdd'}},ev)}});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(RT[h]&&S.profile){U.tab=TABOF[h]||U.tab;render()}});

/* ============ INICIAR ============ */
let wl=null,wlBusy=false;
function wakeSync(){if(!('wakeLock' in navigator))return;
 if(U.live&&!wl&&!wlBusy&&!document.hidden){wlBusy=true;navigator.wakeLock.request('screen').then(l=>{wl=l;wlBusy=false;l.addEventListener('release',()=>{wl=null})}).catch(()=>{wlBusy=false})}
 else if(!U.live&&wl){wl.release().catch(()=>{});wl=null}}
function notify(title,body){try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(title,{body:body,icon:'icon-192.png',tag:'lus'})}catch(e){}}
let lastRemind=Date.now();
function remindTick(){const r=Number(S.set.remind)||0;if(!S.profile||!r)return;const h=new Date().getHours();if(h<8||h>=21)return;
 if(Date.now()-lastRemind<r*60000)return;lastRemind=Date.now();if((S.water[today()]||0)>=waterGoal())return;
 if(!document.hidden)toast('info','Hora de beber água','Registre quando beber. Sem exagero: siga a sua sede.','drop');notify('Hora de beber água','Registre quando beber.')}
let scanT=null,scanStream=null;
function stopScan(){clearInterval(scanT);scanT=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
async function barLookup(code){
 code=String(code||'').replace(/\D/g,'');const m=U.modal;
 if(code.length<8||code.length>14){m.err='Digite o número completo do código (8 a 14 dígitos).';render();return}
 U.busy=true;m.err='';render();
 try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_quantity',{signal:ctl.signal});clearTimeout(to);
  const j=await r.json();const p=j&&j.status===1?j.product:null;
  if(!p){m.err='Produto não encontrado na base. Use a aba Manual e informe os valores do rótulo.'}
  else{const n=p.nutriments||{};const k=n['energy-kcal_100g']!=null?Number(n['energy-kcal_100g']):(n['energy_100g']!=null?Number(n['energy_100g'])/4.184:null);
   if(k==null||!isFinite(k)){m.err='O produto existe, mas sem dados de energia. Use a aba Manual com o rótulo.'}
   else{const id='ean'+code;if(!S.customFoods.some(f=>f.id===id))S.customFoods.push({id:id,n:((p.product_name||'Produto')+(p.brands?' ('+String(p.brands).split(',')[0]+')':'')).slice(0,70),k:R1(k),p:R1(Number(n.proteins_100g)||0),c:R1(Number(n.carbohydrates_100g)||0),f:R1(Number(n.fat_100g)||0),fi:R1(Number(n.fiber_100g)||0),pn:p.serving_quantity?'1 porção':'',pg:Number(p.serving_quantity)||100,custom:true,off:true});
    save();m.tab='base';m.sel=id;m.q='';m.g=String(Number(p.serving_quantity)||100);toast('good','Produto encontrado','Valores por 100 g do Open Food Facts. Confira com o rótulo.','fork')}}
 }catch(e){m.err=(e&&e.name==='AbortError')?'A consulta demorou demais. Verifique a internet e tente de novo.':'Não consegui consultar a base. Verifique a internet. Este recurso não funciona dentro do Claude.'}
 U.busy=false;render()}
async function barScan(){
 const box=$('#barbox');if(!box)return;stopScan();
 try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
  scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.style.cssText='width:100%;max-height:260px;background:#000;border:1px solid var(--line2)';v.srcObject=scanStream;box.innerHTML='';box.appendChild(v);await v.play();
  scanT=setInterval(async()=>{try{const r=await det.detect(v);if(r&&r.length){const c=r[0].rawValue;stopScan();U.modal.f=Object.assign(U.modal.f||{},{code:c});barLookup(c)}}catch(e){}},450)
 }catch(e){stopScan();U.modal.err='Não consegui abrir a câmera. Permita o acesso no navegador (precisa de página segura, https) ou digite o número.';render()}}
function afterLoad(){memo.ver=-1;U.edit=null}
(function boot(){
 S=normalize(lsRead());
 if(S.profile){try{evaluate()}catch(e){}}
 const h=(location.hash||'').slice(1);if(RT[h]&&S.profile)U.tab=TABOF[h]||'painel';
 render();
 window.addEventListener('beforeunload',()=>{lsWrite()});
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();U.inst=e;if(U.tab==='perfil')render()});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)try{wakeSync()}catch(e){}});
 setInterval(remindTick,60000);
 initSync().then(()=>{paintSync()}).catch(()=>{});
 try{window.claude&&window.claude.use&&window.claude.use('sample').then(s=>{U.sample=s;if(U.tab==='evo'&&U.sub.evo==='mentor')render()}).catch(()=>{})}catch(e){}
})();
